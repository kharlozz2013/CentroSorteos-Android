name: Build Cambios Fintech Admin Android

on:
  push:
    branches:
      - casa-cambio-build-20261005
    paths:
      - 'CambiosFintechAdminAndroid/**'
      - '.github/workflows/build-cambios-fintech-admin.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'CambiosFintechAdminAndroid/**'
      - '.github/workflows/build-cambios-fintech-admin.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 36
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Generate Gradle Wrapper
        working-directory: CambiosFintechAdminAndroid
        run: gradle --no-daemon wrapper --gradle-version 8.11.1

      - name: Build debug APK
        working-directory: CambiosFintechAdminAndroid
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: CambiosFintech-Admin-APK
          if-no-files-found: error
          retention-days: 1
          path: CambiosFintechAdminAndroid/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Admin Android project
        uses: actions/upload-artifact@v4
        with:
          name: CambiosFintech-Admin-Android-Project
          if-no-files-found: error
          retention-days: 1
          path: |
            CambiosFintechAdminAndroid/settings.gradle
            CambiosFintechAdminAndroid/build.gradle
            CambiosFintechAdminAndroid/gradle.properties
            CambiosFintechAdminAndroid/gradlew
            CambiosFintechAdminAndroid/gradlew.bat
            CambiosFintechAdminAndroid/gradle/wrapper/**
            CambiosFintechAdminAndroid/app/build.gradle
            CambiosFintechAdminAndroid/app/proguard-rules.pro
            CambiosFintechAdminAndroid/app/src/**
