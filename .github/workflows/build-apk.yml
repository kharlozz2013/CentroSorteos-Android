name: Validar Centro Sorteos Web Fase 3
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruir Fase 3
        shell: bash
        run: |
          base64 -d CentroSorteos_WEB_Fase3_payload.txt > /tmp/fase3.tar.xz
          mkdir -p web
          tar -xJf /tmp/fase3.tar.xz -C web
      - name: Validar sintaxis y UI Fase 3
        shell: bash
        run: |
          python -m py_compile web/serverapp/app.py web/serverapp/mobile_server.py
          node --check web/serverapp/assets/js/app.js
          node --check web/serverapp/assets/js/admin-shell.js
          grep -F 'admin-user-whatsapp' web/serverapp/assets/css/styles.css
          grep -F 'https://wa.me/' web/serverapp/assets/js/admin-shell.js
          grep -F 'adminUserCount' web/serverapp/templates/admin.html
          grep -F 'adminUserRefresh' web/serverapp/templates/admin.html
          grep -F 'Participaciones' web/serverapp/assets/js/admin-shell.js
          grep -F 'Referidos' web/serverapp/assets/js/admin-shell.js
          grep -F 'Registro directo' web/serverapp/assets/js/admin-shell.js
          grep -F 'Buscar WhatsApp, código o referidor' web/serverapp/templates/admin.html
      - name: Instalar backend
        working-directory: web
        run: python -m pip install --quiet -r requirements.txt
      - name: Probar backend Fase 3
        working-directory: web
        shell: bash
        run: |
          python - <<'PY'
          import os, tempfile, re
          from pathlib import Path
          os.environ['SORTEOS_DB']=str(Path(tempfile.mkdtemp())/'fase3.db')
          os.environ['ADMIN_USER']='admin'
          os.environ['ADMIN_PASSWORD']='Admin123!'
          from serverapp.app import app
          app.config['TESTING']=True
          c=app.test_client()
          login=c.get('/admin/login').get_data(as_text=True)
          token=re.search(r'name="csrf_token"[^>]*value="([^"]+)"',login)
          assert token
          r=c.post('/admin/login',data={'csrf_token':token.group(1),'username':'admin','password':'Admin123!'},follow_redirects=True)
          assert r.status_code==200
          html=r.get_data(as_text=True)
          for needle in ('Usuarios del sistema','adminUserCount','adminUserRefresh','Buscar WhatsApp, código o referidor'):
              assert needle in html, needle
          snap=c.get('/api/snapshot')
          assert snap.status_code==200 and snap.get_json()['ok'] is True
          print('FASE3_BACKEND_OK')
          PY
