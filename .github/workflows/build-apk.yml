name: Build Centro Sorteos Fase 6 FINAL
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruir web final
        shell: bash
        run: |
          base64 -d CentroSorteos_WEB_Fase6_FINAL_payload.txt > /tmp/fase6.tar.xz
          mkdir -p web
          tar -xJf /tmp/fase6.tar.xz -C web
      - name: Validar integración Fases 1-5
        shell: bash
        run: |
          python -m py_compile web/serverapp/app.py web/serverapp/mobile_server.py
          node --check web/serverapp/assets/js/app.js
          node --check web/serverapp/assets/js/admin-shell.js
          grep -F 'adminRewardConfigDirty' web/serverapp/assets/js/app.js
          grep -F 'recordRewardRaffleParticipation' web/serverapp/assets/js/app.js
          grep -F 'Participaciones del sorteo principal' web/serverapp/templates/admin.html
          grep -F 'Bonos virtuales por referidos' web/serverapp/templates/admin.html
          grep -F 'admin-user-whatsapp' web/serverapp/assets/css/styles.css
          grep -F 'Participantes y oportunidades' web/serverapp/templates/admin.html
          grep -F 'loadPersistedGeneratedFlyer' web/serverapp/assets/js/app.js
          grep -F 'Sin reserva de número' web/serverapp/templates/admin.html
          grep -F 'withdrawPaymentMethod' web/serverapp/templates/index.html
          grep -F 'máximo 1 número por usuario' web/serverapp/assets/js/app.js
          grep -F '?v=fase6' web/serverapp/templates/index.html
          grep -F '?v=fase6' web/serverapp/templates/admin.html
          if grep -F 'Fase 12 Estadísticas conectadas' web/serverapp/templates/index.html; then
            echo 'ERROR: texto Fase 12 todavía visible'
            exit 1
          fi
      - name: Probar backend final
        shell: bash
        working-directory: web
        run: |
          python -m pip install --quiet -r requirements.txt
          python - <<'PY'
          import os, tempfile, re
          from pathlib import Path
          os.environ['SORTEOS_DB']=str(Path(tempfile.mkdtemp())/'fase6.db')
          os.environ['ADMIN_USER']='admin'
          os.environ['ADMIN_PASSWORD']='Admin123!'
          from serverapp.app import app
          app.config['TESTING']=True
          c=app.test_client()
          assert c.get('/api/health').status_code==200
          assert c.get('/api/revision').status_code==200
          assert c.get('/api/snapshot').status_code==200
          assert c.get('/assets/css/styles.css').status_code==200
          assert c.get('/assets/js/app.js').status_code==200
          r=c.post('/api/auth/register',json={'phone':'+584141234567','iso':'VE','password':'123456'})
          assert r.status_code==201, r.get_data(as_text=True)
          code=r.get_json()['user']['referralCode']
          r2=c.post('/api/auth/register',json={'phone':'+584241234567','iso':'VE','password':'123456','referral':code})
          assert r2.status_code==201, r2.get_data(as_text=True)
          login=c.get('/admin/login').get_data(as_text=True)
          token=re.search(r'name="csrf_token"[^>]*value="([^"]+)"',login)
          assert token
          rr=c.post('/admin/login',data={'csrf_token':token.group(1),'username':'admin','password':'Admin123!'})
          assert rr.status_code in (302,303)
          config=[{'id':'RW-167','amount':2.0,'views':500,'raffles':3,'referrals':2,'enabled':True}]
          saved=c.put('/api/store/sorteos_demo_reward_config_v1',json={'value':config})
          assert saved.status_code==200
          got=c.get('/api/store/sorteos_demo_reward_config_v1').get_json()['value']
          assert got[0]['views']==500 and got[0]['raffles']==3 and got[0]['referrals']==2
          print('FASE6_BACKEND_OK')
          PY

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: user
            payload_ref: 060adbe499744501aa10625083bb9a1bf554198a
            package_dir: com/centrosorteos/app
            version_code: 6
            version_name: 1.3.0
            app_url: http://76.13.126.244:8090/
            manifest_file: user.json
          - target: admin
            payload_ref: 261d6ecfafe705ea519d7aa9a2ab043e8771bb79
            package_dir: com/centrosorteos/admin
            version_code: 9
            version_name: 1.4.0
            app_url: http://76.13.126.244:8090/admin/login
            manifest_file: admin.json

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruir proyecto
        shell: bash
        run: |
          git show "${{ matrix.payload_ref }}:CentroSorteos_Android_payload.txt" > /tmp/payload.txt
          base64 -d /tmp/payload.txt > /tmp/project.tar.xz
          mkdir -p project
          tar -xJf /tmp/project.tar.xz -C project
      - name: Configurar cliente central
        shell: bash
        env:
          APP_URL: ${{ matrix.app_url }}
          MANIFEST_FILE: ${{ matrix.manifest_file }}
          VERSION_CODE: ${{ matrix.version_code }}
          VERSION_NAME: ${{ matrix.version_name }}
          PACKAGE_DIR: ${{ matrix.package_dir }}
        run: |
          python3.13 - <<'PY'
          import os, re
          from pathlib import Path
          java = Path("project/app/src/main/java") / os.environ["PACKAGE_DIR"] / "MainActivity.java"
          gradle = Path("project/app/build.gradle.kts")
          s=java.read_text(encoding='utf-8')
          s=s.replace('https://www.viralenunclick.com/sorteos-updates/','http://76.13.126.244:8089/')
          s=s.replace('startsWith("https://")','startsWith("http://76.13.126.244:8089/")')
          replacement='''    private void startPythonServer() {
              if (appStarted) return;
              appStarted = true;
              progress.setVisibility(View.VISIBLE);
              webView.loadUrl("__APP_URL__");
          }

          private void showStartupError'''.replace('__APP_URL__',os.environ['APP_URL'])
          s,n=re.subn(r'    private void startPythonServer\(\) \{.*?\n    \}\n\n    private void showStartupError',replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('No se pudo reemplazar startPythonServer')
          java.write_text(s,encoding='utf-8')
          g=gradle.read_text(encoding='utf-8')
          g=re.sub(r'versionCode = \d+',f'versionCode = {os.environ["VERSION_CODE"]}',g)
          g=re.sub(r'versionName = "[^"]+"',f'versionName = "{os.environ["VERSION_NAME"]}"',g)
          gradle.write_text(g,encoding='utf-8')
          PY
          JAVA_FILE="project/app/src/main/java/${{ matrix.package_dir }}/MainActivity.java"
          grep -F 'http://76.13.126.244:8089/${{ matrix.manifest_file }}' "$JAVA_FILE"
          grep -F 'webView.loadUrl("${{ matrix.app_url }}")' "$JAVA_FILE"
          grep -F 'versionCode = ${{ matrix.version_code }}' project/app/build.gradle.kts
          grep -F 'versionName = "${{ matrix.version_name }}"' project/app/build.gradle.kts
          grep -F 'android:usesCleartextTraffic="true"' project/app/src/main/AndroidManifest.xml
      - name: Preparar Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar Release sin firma
        working-directory: project
        run: gradle :app:assembleRelease --stacktrace -Pchaquopy.buildPython=$(command -v python3.13)
      - name: Preparar artefacto
        shell: bash
        run: |
          mkdir -p release-bundle
          cp project/app/build/outputs/apk/release/app-release-unsigned.apk release-bundle/app-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" release-bundle/zipalign
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release-bundle/apksigner.jar
          chmod +x release-bundle/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: centro-sorteos-${{ matrix.target }}-fase6-final-unsigned
          path: release-bundle/
          if-no-files-found: error
