name: Build Centro Sorteos User Icon v4
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reconstruir proyecto
        shell: bash
        run: |
          test -f CentroSorteos_Android_payload.txt
          base64 -d CentroSorteos_Android_payload.txt > /tmp/project.tar.xz
          mkdir -p project
          tar -xJf /tmp/project.tar.xz -C project

      - name: Validar versión, icono y actualizador
        shell: bash
        run: |
          grep -F 'versionCode = 4' project/app/build.gradle.kts
          grep -F 'versionName = "1.1.2"' project/app/build.gradle.kts
          grep -F 'android:icon="@mipmap/ic_launcher"' project/app/src/main/AndroidManifest.xml
          grep -F 'http://76.13.126.244:8089/user.json' project/app/src/main/java/com/centrosorteos/app/MainActivity.java
          grep -F 'startsWith("http://76.13.126.244:8089/")' project/app/src/main/java/com/centrosorteos/app/MainActivity.java
          test -s project/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s project/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s project/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -s project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -s project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          if grep -R "viralenunclick.com/sorteos-updates" project/app/src/main; then
            echo "ERROR: quedó una referencia al dominio anterior"
            exit 1
          fi

      - name: Probar servidor local
        working-directory: project/app/src/main/python
        shell: bash
        run: |
          python3.13 -m pip install --quiet "Flask>=3.0,<4" "Werkzeug>=3.0,<4"
          python3.13 - <<'PY'
          import tempfile, urllib.request
          from serverapp.mobile_server import start_server
          url = start_server(tempfile.mkdtemp(prefix='centro-sorteos-user-v4-icon-'))
          assert isinstance(url, str) and url.startswith('http://127.0.0.1:'), url
          with urllib.request.urlopen(url, timeout=5) as r:
              body = r.read()
              assert r.status == 200, r.status
              assert len(body) > 100
          print('LOCAL_SERVER_OK', url)
          PY

      - name: Preparar Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar Release sin firma
        working-directory: project
        run: gradle :app:assembleRelease --stacktrace -Pchaquopy.buildPython=$(command -v python3.13)

      - name: Preparar artefacto
        shell: bash
        run: |
          mkdir -p release-bundle
          cp project/app/build/outputs/apk/release/app-release-unsigned.apk release-bundle/app-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" release-bundle/zipalign
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release-bundle/apksigner.jar
          chmod +x release-bundle/zipalign
          sha256sum release-bundle/app-release-unsigned.apk > release-bundle/unsigned.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: centro-sorteos-user-v4-icon-unsigned
          path: release-bundle/
          if-no-files-found: error
