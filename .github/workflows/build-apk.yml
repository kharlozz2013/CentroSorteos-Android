name: Validar Centro Sorteos Web Fase 1
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruir Fase 1
        shell: bash
        run: |
          base64 -d CentroSorteos_WEB_Fase1_payload.txt > /tmp/fase1.tar.xz
          mkdir -p web
          tar -xJf /tmp/fase1.tar.xz -C web
      - name: Validar sintaxis y reglas Fase 1
        shell: bash
        run: |
          python -m py_compile web/serverapp/app.py web/serverapp/mobile_server.py
          node --check web/serverapp/assets/js/app.js
          grep -F 'adminRewardConfigDirty' web/serverapp/assets/js/app.js
          grep -F 'recordRewardRaffleParticipation' web/serverapp/assets/js/app.js
          grep -F 'trackingVersion:2' web/serverapp/assets/js/app.js
          grep -F 'Configuración de recompensas guardada en el servidor' web/serverapp/assets/js/app.js
          grep -F 'Tienes cambios sin guardar' web/serverapp/assets/js/app.js
          grep -F 'Solo comprobantes enviados después de activar el reto' web/serverapp/assets/js/app.js
          grep -F 'cada Sorteo Principal o Comunitario distinto' web/serverapp/templates/index.html
      - name: Instalar backend
        working-directory: web
        run: python -m pip install --quiet -r requirements.txt
      - name: Probar persistencia de recompensas
        working-directory: web
        shell: bash
        run: |
          python - <<'PY'
          import os, tempfile, re
          from pathlib import Path
          os.environ['SORTEOS_DB']=str(Path(tempfile.mkdtemp())/'phase1.db')
          os.environ['ADMIN_USER']='admin'
          os.environ['ADMIN_PASSWORD']='Admin123!'
          from serverapp.app import app
          app.config['TESTING']=True
          client=app.test_client()

          blocked=client.put('/api/store/sorteos_demo_reward_config_v1',json={'value':[]})
          assert blocked.status_code==403

          login=client.get('/admin/login').get_data(as_text=True)
          token=re.search(r'name="csrf_token"[^>]*value="([^"]+)"',login)
          assert token
          response=client.post('/admin/login',data={'csrf_token':token.group(1),'username':'admin','password':'Admin123!'})
          assert response.status_code in (302,303)

          config=[
            {'id':'RW-167','amount':2.00,'views':500,'raffles':3,'referrals':2,'enabled':True},
            {'id':'RW-080','amount':0.80,'views':1500,'raffles':5,'referrals':3,'enabled':True},
            {'id':'RW-055','amount':0.55,'views':900,'raffles':3,'referrals':2,'enabled':True},
            {'id':'RW-020','amount':0.20,'views':300,'raffles':1,'referrals':1,'enabled':True},
          ]
          saved=client.put('/api/store/sorteos_demo_reward_config_v1',json={'value':config})
          assert saved.status_code==200, saved.get_data(as_text=True)
          reread=client.get('/api/store/sorteos_demo_reward_config_v1').get_json()['value']
          assert reread[0]['amount']==2.0
          assert reread[0]['views']==500
          assert reread[0]['raffles']==3
          assert reread[0]['referrals']==2
          snap=client.get('/api/snapshot').get_json()
          assert snap['store']['sorteos_demo_reward_config_v1'][0]['views']==500
          print('PHASE1_REWARD_PERSISTENCE_OK')
          PY
