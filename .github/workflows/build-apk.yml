name: Build Centro Sorteos APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verificar Python 3.13
        run: |
          python3.13 --version
          command -v python3.13
      - name: Reconstruir proyecto
        shell: bash
        run: |
          test -f CentroSorteos_Android_payload.txt
          base64 -d CentroSorteos_Android_payload.txt > /tmp/project.tar.xz
          mkdir -p project
          tar -xJf /tmp/project.tar.xz -C project --strip-components=1
      - name: Probar servidor Admin
        working-directory: project/app/src/main/python
        shell: bash
        run: |
          python3.13 -m pip install --quiet "Flask>=3.0,<4" "Werkzeug>=3.0,<4"
          export SORTEOS_DB="$RUNNER_TEMP/admin-smoke/sorteos.db"
          export SECRET_KEY="ci-admin-smoke-secret"
          python3.13 - <<'PY'
          import re
          from serverapp.app import app, init_db
          init_db()
          c = app.test_client()
          r = c.get('/admin/login')
          assert r.status_code == 200, ('GET /admin/login', r.status_code, r.data[:500])
          m = re.search(rb'name="csrf_token" value="([^"]+)"', r.data)
          assert m, 'No se encontró CSRF en login'
          r = c.post('/admin/login', data={
              'csrf_token': m.group(1).decode(),
              'username': 'admin',
              'password': 'Admin123!'
          }, follow_redirects=False)
          assert r.status_code in (301, 302, 303), ('POST /admin/login', r.status_code, r.data[:500])
          r = c.get('/admin')
          assert r.status_code == 200, ('GET /admin', r.status_code, r.data[:500])
          print('ADMIN_SMOKE_TEST_OK')
          PY
      - name: Probar arranque local Android-Python
        working-directory: project/app/src/main/python
        shell: bash
        run: |
          python3.13 - <<'PY'
          import tempfile, urllib.request
          from serverapp.mobile_server import start_server
          assert start_server(tempfile.mkdtemp(prefix='centro-admin-')) is True
          with urllib.request.urlopen('http://127.0.0.1:8765/admin/login', timeout=5) as r:
              body = r.read()
              assert r.status == 200
              assert b'csrf_token' in body
          print('ANDROID_LOCAL_SERVER_OK')
          PY
      - name: Preparar Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar APK Debug
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace -Pchaquopy.buildPython=$(command -v python3.13)
      - name: Verificar APK
        shell: bash
        run: |
          test -s project/app/build/outputs/apk/debug/app-debug.apk
          sha256sum project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh project/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CentroSorteos-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
