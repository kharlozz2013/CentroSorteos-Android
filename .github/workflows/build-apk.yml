name: Build Centro Sorteos VPS 8089
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: user
            payload_ref: 5d68d1a4a18e4c37fdb80cd784081e650bcda109
            manifest_file: user.json
          - target: admin
            payload_ref: 261d6ecfafe705ea519d7aa9a2ab043e8771bb79
            manifest_file: admin.json
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reconstruir proyecto ${{ matrix.target }}
        shell: bash
        run: |
          git show "${{ matrix.payload_ref }}:CentroSorteos_Android_payload.txt" > /tmp/payload.txt
          base64 -d /tmp/payload.txt > /tmp/project.tar.xz
          mkdir -p project
          tar -xJf /tmp/project.tar.xz -C project

      - name: Apuntar actualizador al VPS
        shell: bash
        run: |
          JAVA_FILE="$(find project/app/src/main/java -name MainActivity.java -print -quit)"
          test -n "$JAVA_FILE"
          sed -i 's#https://www\.viralenunclick\.com/sorteos-updates/#http://76.13.126.244:8089/#g' "$JAVA_FILE"
          sed -i 's#startsWith("https://")#startsWith("http://76.13.126.244:8089/")#g' "$JAVA_FILE"

          grep -F 'http://76.13.126.244:8089/${{ matrix.manifest_file }}' "$JAVA_FILE"
          grep -F 'startsWith("http://76.13.126.244:8089/")' "$JAVA_FILE"
          grep -F 'android:usesCleartextTraffic="true"' project/app/src/main/AndroidManifest.xml
          if grep -R "viralenunclick.com/sorteos-updates" project/app/src/main; then
            echo "ERROR: quedó una referencia al dominio anterior"
            exit 1
          fi

      - name: Probar servidor local
        working-directory: project/app/src/main/python
        shell: bash
        run: |
          python3.13 -m pip install --quiet "Flask>=3.0,<4" "Werkzeug>=3.0,<4"
          python3.13 - <<'PY'
          import tempfile, urllib.request
          from serverapp.mobile_server import start_server
          url = start_server(tempfile.mkdtemp(prefix='centro-sorteos-vps8089-'))
          assert isinstance(url, str) and url.startswith('http://127.0.0.1:'), url
          with urllib.request.urlopen(url, timeout=5) as r:
              body = r.read()
              assert r.status == 200, r.status
              assert len(body) > 100
          print('LOCAL_SERVER_OK', url)
          PY

      - name: Preparar Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar Release sin firma
        working-directory: project
        run: gradle :app:assembleRelease --stacktrace -Pchaquopy.buildPython=$(command -v python3.13)

      - name: Preparar artefacto
        shell: bash
        run: |
          mkdir -p release-bundle
          cp project/app/build/outputs/apk/release/app-release-unsigned.apk release-bundle/app-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" release-bundle/zipalign
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release-bundle/apksigner.jar
          chmod +x release-bundle/zipalign
          sha256sum release-bundle/app-release-unsigned.apk > release-bundle/unsigned.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: centro-sorteos-${{ matrix.target }}-vps8089-unsigned
          path: release-bundle/
          if-no-files-found: error
