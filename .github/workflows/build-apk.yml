name: Validar Centro Sorteos Web Fase 7
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reconstruir Fase 7
        shell: bash
        run: |
          base64 -d CentroSorteos_WEB_Fase7_payload.txt > /tmp/fase7.tar.xz
          mkdir -p web
          tar -xJf /tmp/fase7.tar.xz -C web

      - name: Validar sintaxis
        shell: bash
        run: |
          python -m py_compile web/serverapp/app.py web/serverapp/mobile_server.py
          node --check web/serverapp/assets/js/app.js
          node --check web/serverapp/assets/js/admin-shell.js

      - name: Validar Sorteo Principal único
        shell: bash
        run: |
          grep -F 'Un solo sorteo. <span>Más formas de ganar.</span>' web/serverapp/templates/index.html
          grep -F '1 referido aprobado = +1 oportunidad virtual' web/serverapp/templates/index.html
          grep -F 'Único sistema de sorteo' web/serverapp/templates/admin.html
          grep -F 'approvedReferralSourcesForPhone' web/serverapp/assets/js/app.js
          grep -F 'allReferralBonusEntries' web/serverapp/assets/js/app.js
          grep -F "user.referralStatus === 'approved' && user.referralRewardGranted" web/serverapp/assets/js/app.js
          grep -F "event.type !== 'main'" web/serverapp/assets/js/app.js
          grep -F 'Cada Sorteo Principal distinto cuenta una sola vez' web/serverapp/assets/js/app.js
          grep -F 'Bonos virtuales' web/serverapp/assets/js/admin-shell.js
          grep -F '?v=fase7' web/serverapp/templates/index.html
          grep -F '?v=fase7' web/serverapp/templates/admin.html
          if grep -F 'SORTEO COMUNITARIO' web/serverapp/templates/index.html web/serverapp/templates/admin.html; then
            echo 'ERROR: quedó Sorteo Comunitario visible'
            exit 1
          fi
          if grep -F 'sorteos_demo_community_raffles_v1' web/serverapp/app.py; then
            echo 'ERROR: backend todavía expone el store comunitario'
            exit 1
          fi

      - name: Instalar backend
        working-directory: web
        run: python -m pip install --quiet -r requirements.txt

      - name: Probar backend Fase 7
        working-directory: web
        shell: bash
        run: |
          python - <<'PY'
          import os, tempfile, re
          from pathlib import Path
          os.environ['SORTEOS_DB']=str(Path(tempfile.mkdtemp())/'fase7.db')
          os.environ['ADMIN_USER']='admin'
          os.environ['ADMIN_PASSWORD']='Admin123!'
          from serverapp.app import app
          app.config['TESTING']=True
          c=app.test_client()
          assert c.get('/api/health').status_code==200
          assert c.get('/').status_code==200
          html=c.get('/').get_data(as_text=True)
          assert 'SORTEO COMUNITARIO' not in html
          assert 'SORTEO PRINCIPAL' in html
          mary=c.post('/api/auth/register',json={'phone':'+584141111111','iso':'VE','password':'123456'}).get_json()
          assert mary['ok']
          code=mary['user']['referralCode']
          sofia=c.post('/api/auth/register',json={'phone':'+584142222222','iso':'VE','password':'123456','referral':code}).get_json()
          assert sofia['ok'] and sofia['user']['referredBy']==code
          login=c.get('/admin/login').get_data(as_text=True)
          token=re.search(r'name="csrf_token"[^>]*value="([^"]+)"',login)
          assert token
          r=c.post('/admin/login',data={'csrf_token':token.group(1),'username':'admin','password':'Admin123!'})
          assert r.status_code in (302,303)
          snap=c.get('/api/snapshot').get_json()
          assert 'sorteos_demo_community_raffles_v1' not in snap['store']
          print('FASE7_BACKEND_OK')
          PY
