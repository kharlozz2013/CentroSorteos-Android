name: Build Centro Sorteos Unsigned Release
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruir proyecto
        shell: bash
        run: |
          test -f CentroSorteos_Android_payload.txt
          base64 -d CentroSorteos_Android_payload.txt > /tmp/project.tar.xz
          mkdir -p project
          tar -xJf /tmp/project.tar.xz -C project
      - name: Probar servidor local
        working-directory: project/app/src/main/python
        shell: bash
        run: |
          python3.13 -m pip install --quiet "Flask>=3.0,<4" "Werkzeug>=3.0,<4"
          python3.13 - <<'PY'
          import tempfile, urllib.request
          from serverapp.mobile_server import start_server
          url = start_server(tempfile.mkdtemp(prefix='centro-sorteos-release-'))
          assert isinstance(url, str) and url.startswith('http://127.0.0.1:'), url
          with urllib.request.urlopen(url, timeout=5) as r:
              body = r.read()
              assert r.status == 200, r.status
              assert len(body) > 100
          print('LOCAL_SERVER_OK', url)
          PY
      - name: Preparar Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar Release sin firma
        working-directory: project
        run: gradle :app:assembleRelease --stacktrace -Pchaquopy.buildPython=$(command -v python3.13)
      - name: Preparar artefacto para firma privada
        shell: bash
        run: |
          mkdir -p release-bundle
          cp project/app/build/outputs/apk/release/app-release-unsigned.apk release-bundle/app-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" release-bundle/zipalign
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release-bundle/apksigner.jar
          chmod +x release-bundle/zipalign
          test -s release-bundle/app-release-unsigned.apk
          sha256sum release-bundle/app-release-unsigned.apk > release-bundle/unsigned.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: centro-sorteos-unsigned-release
          path: release-bundle/
          if-no-files-found: error
