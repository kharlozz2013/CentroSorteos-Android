name: Validar Centro Sorteos Web Fase 8
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reconstruir Fase 8
        shell: bash
        run: |
          base64 -d CentroSorteos_WEB_Fase8_payload.txt > /tmp/fase8.tar.xz
          mkdir -p web
          tar -xJf /tmp/fase8.tar.xz -C web

      - name: Validar sintaxis y estructura
        shell: bash
        run: |
          python -m py_compile web/serverapp/app.py web/serverapp/mobile_server.py
          node --check web/serverapp/assets/js/app.js
          node --check web/serverapp/assets/js/admin-shell.js
          ! grep -qi 'SORTEO COMUNITARIO' web/serverapp/templates/index.html
          ! grep -q 'Sorteo comunitario' web/serverapp/templates/admin.html
          grep -F 'Un solo sorteo. <span>Más formas de ganar.</span>' web/serverapp/templates/index.html
          grep -F 'mainMyVirtualEntries' web/serverapp/templates/index.html
          grep -F 'cada Sorteo Principal distinto' web/serverapp/templates/index.html
          grep -F "referred.referralStatus === 'approved'" web/serverapp/assets/js/app.js
          grep -F "event.type !== 'main'" web/serverapp/assets/js/app.js
          grep -F 'Omitir todo' web/serverapp/assets/js/app.js
          grep -F 'Lo importante en tu cuenta' web/serverapp/assets/js/app.js
          grep -F 'Sorteo actual' web/serverapp/assets/js/app.js
          grep -F 'Comparte tu código personal' web/serverapp/assets/js/app.js
          grep -F 'Recompensa 4' web/serverapp/assets/js/app.js
          grep -F 'Nuevo comprobante' web/serverapp/assets/js/app.js
          grep -F 'data-tour-start="inicio"' web/serverapp/templates/index.html
          grep -F 'data-tour-start="actividad"' web/serverapp/templates/index.html
          grep -F '?v=fase8' web/serverapp/templates/index.html
          grep -F '?v=fase8' web/serverapp/templates/admin.html

      - name: Instalar backend
        working-directory: web
        run: python -m pip install --quiet -r requirements.txt

      - name: Probar backend y recursos
        working-directory: web
        shell: bash
        run: |
          export SORTEOS_DB="$RUNNER_TEMP/sorteos-fase8.db"
          export HOST=127.0.0.1
          export PORT=5058
          export ADMIN_USER=admin
          export ADMIN_PASSWORD='Admin123!'
          python -m serverapp.app >/tmp/fase8.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5058/api/health >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:5058/api/health | grep -F '"ok":true'
          curl -fsSI http://127.0.0.1:5058/assets/css/styles.css | grep -F '200 OK'
          curl -fsSI http://127.0.0.1:5058/assets/js/app.js | grep -F '200 OK'
          curl -fsS http://127.0.0.1:5058/ > /tmp/index.html
          grep -F 'Ver guía de Inicio' /tmp/index.html
          grep -F 'Ver guía de Sorteo' /tmp/index.html
          grep -F 'Tus oportunidades' /tmp/index.html
          ! grep -qi 'SORTEO COMUNITARIO' /tmp/index.html

      - name: Probar persistencia base
        working-directory: web
        shell: bash
        run: |
          python - <<'PY'
          import os, tempfile, re
          from pathlib import Path
          os.environ['SORTEOS_DB']=str(Path(tempfile.mkdtemp())/'fase8-persist.db')
          os.environ['ADMIN_USER']='admin'
          os.environ['ADMIN_PASSWORD']='Admin123!'
          from serverapp.app import app
          app.config['TESTING']=True
          c=app.test_client()
          r=c.post('/api/auth/register',json={'phone':'+584141111111','iso':'VE','password':'123456'})
          assert r.status_code==201, r.get_data(as_text=True)
          code=r.get_json()['user']['referralCode']
          r2=c.post('/api/auth/register',json={'phone':'+584241111111','iso':'VE','password':'123456','referral':code})
          assert r2.status_code==201, r2.get_data(as_text=True)
          login=c.get('/admin/login').get_data(as_text=True)
          token=re.search(r'name="csrf_token"[^>]*value="([^"]+)"',login)
          assert token
          auth=c.post('/admin/login',data={'csrf_token':token.group(1),'username':'admin','password':'Admin123!'})
          assert auth.status_code in (302,303)
          snap=c.get('/api/snapshot').get_json()
          assert snap['ok'] is True and len(snap['users'])==2
          print('FASE8_BACKEND_OK')
          PY
