name: Validar Centro Sorteos Web Fase 7
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reconstruir Fase 7
        shell: bash
        run: |
          base64 -d CentroSorteos_WEB_Fase7_payload.txt > /tmp/fase7.tar.xz
          mkdir -p web
          tar -xJf /tmp/fase7.tar.xz -C web

      - name: Validar sintaxis e integración Fase 7
        shell: bash
        run: |
          python -m py_compile web/serverapp/app.py web/serverapp/mobile_server.py
          node --check web/serverapp/assets/js/app.js
          node --check web/serverapp/assets/js/admin-shell.js
          grep -F 'Este es el único sorteo de la plataforma' web/serverapp/templates/index.html
          grep -F '1 referido aprobado = +1 oportunidad virtual' web/serverapp/templates/index.html
          grep -F 'cada Sorteo Principal distinto' web/serverapp/templates/index.html
          grep -F 'Cada referido directo aprobado por el Admin aporta +1 oportunidad virtual' web/serverapp/templates/admin.html
          grep -F 'approvedReferralSourcesForPhone' web/serverapp/assets/js/app.js
          grep -F "if (referred.referredBy !== inviter.referralCode || referred.referralStatus !== 'approved')" web/serverapp/assets/js/app.js
          grep -F "if(type!=='main'||!phone||!raffle?.id)return false;" web/serverapp/assets/js/app.js
          grep -F "event.type !== 'main'" web/serverapp/assets/js/app.js
          grep -F '?v=fase7' web/serverapp/templates/index.html
          grep -F '?v=fase7' web/serverapp/templates/admin.html
          if grep -Ei 'SORTEO COMUNITARIO|Sorteo comunitario|Sorteos comunitarios|SEGUNDO SISTEMA' web/serverapp/templates/index.html web/serverapp/templates/admin.html; then
            echo 'ERROR: todavía existe UI visible del Sorteo Comunitario'
            exit 1
          fi

      - name: Instalar backend
        working-directory: web
        run: python -m pip install --quiet -r requirements.txt

      - name: Probar backend y pantallas
        working-directory: web
        shell: bash
        run: |
          python - <<'PY'
          import os, tempfile, re
          from pathlib import Path
          os.environ['SORTEOS_DB']=str(Path(tempfile.mkdtemp())/'fase7.db')
          os.environ['ADMIN_USER']='admin'
          os.environ['ADMIN_PASSWORD']='Admin123!'
          from serverapp.app import app
          app.config['TESTING']=True
          c=app.test_client()
          assert c.get('/api/health').status_code==200
          assert c.get('/api/revision').status_code==200
          user_html=c.get('/').get_data(as_text=True)
          assert 'Este es el único sorteo de la plataforma' in user_html
          assert 'SORTEO COMUNITARIO' not in user_html
          reg1=c.post('/api/auth/register',json={'phone':'+584141111111','iso':'VE','password':'123456'})
          assert reg1.status_code==201, reg1.get_data(as_text=True)
          code=reg1.get_json()['user']['referralCode']
          reg2=c.post('/api/auth/register',json={'phone':'+584242222222','iso':'VE','password':'123456','referral':code})
          assert reg2.status_code==201, reg2.get_data(as_text=True)
          login=c.get('/admin/login').get_data(as_text=True)
          token=re.search(r'name="csrf_token"[^>]*value="([^"]+)"',login)
          assert token
          rr=c.post('/admin/login',data={'csrf_token':token.group(1),'username':'admin','password':'Admin123!'},follow_redirects=True)
          assert rr.status_code==200
          admin_html=rr.get_data(as_text=True)
          assert 'Sorteo comunitario' not in admin_html
          assert 'Participaciones del sorteo principal' in admin_html
          assert 'Bonos virtuales por referidos' in admin_html
          print('FASE7_BACKEND_OK')
          PY
