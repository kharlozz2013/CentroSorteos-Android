name: Validar Centro Sorteos Web Fase 2
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reconstruir Fase 2
        shell: bash
        run: |
          base64 -d CentroSorteos_WEB_Fase2_payload.txt > /tmp/fase2.tar.xz
          mkdir -p web
          tar -xJf /tmp/fase2.tar.xz -C web

      - name: Validar sintaxis y UI Fase 2
        shell: bash
        run: |
          python -m py_compile web/serverapp/app.py web/serverapp/mobile_server.py
          node --check web/serverapp/assets/js/app.js
          grep -F 'Participaciones del sorteo principal' web/serverapp/templates/admin.html
          grep -F 'Bonos virtuales por referidos' web/serverapp/templates/admin.html
          grep -F 'data-participation-filter="confirmed"' web/serverapp/templates/admin.html
          grep -F 'function whatsappAdminLink' web/serverapp/assets/js/app.js
          grep -F 'function participantOrigin' web/serverapp/assets/js/app.js
          grep -F 'adminVirtualBonusList' web/serverapp/assets/js/app.js
          grep -F 'data-admin-jump-participations' web/serverapp/assets/js/app.js
          grep -F 'admin-whatsapp-link' web/serverapp/assets/css/styles.css
          grep -F 'trackingVersion:2' web/serverapp/assets/js/app.js

      - name: Instalar backend
        working-directory: web
        run: python -m pip install --quiet -r requirements.txt

      - name: Probar backend y recursos
        working-directory: web
        shell: bash
        run: |
          export SORTEOS_DB="$RUNNER_TEMP/sorteos-fase2.db"
          export HOST=127.0.0.1
          export PORT=5055
          python -m serverapp.app >/tmp/fase2.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5055/api/health >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:5055/api/health | grep -F '"ok":true'
          curl -fsSI http://127.0.0.1:5055/assets/css/styles.css | grep -F '200 OK'
          curl -fsSI http://127.0.0.1:5055/assets/js/app.js | grep -F '200 OK'
