name: Build Casa Cambio Android

on:
  push:
    branches:
      - casa-cambio-build-20261005
    paths:
      - 'CasaCambioAndroid/**'
      - '.github/workflows/build-casa-cambio.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'CasaCambioAndroid/**'
      - '.github/workflows/build-casa-cambio.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android SDK 36
        uses: android-actions/setup-android@v3

      - name: Install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build release APK and AAB
        working-directory: CasaCambioAndroid
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Upload unsigned release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: casa-cambio-android-unsigned
          if-no-files-found: error
          retention-days: 1
          path: |
            CasaCambioAndroid/app/build/outputs/apk/release/*.apk
            CasaCambioAndroid/app/build/outputs/bundle/release/*.aab
