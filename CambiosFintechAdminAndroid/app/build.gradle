plugins {
    id 'com.android.application'
}

android {
    namespace 'com.viralenunclick.cambiosfintech.admin'
    compileSdk 36

    defaultConfig {
        applicationId "com.viralenunclick.cambiosfintech.admin"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
